<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
  <rect width="480" height="300" fill="#f8fafc"/>
  <!-- Axes -->
  <line x1="60" y1="250" x2="440" y2="250" stroke="#1e293b" stroke-width="2"/>
  <line x1="60" y1="250" x2="60" y2="30" stroke="#1e293b" stroke-width="2"/>
  <!-- Y-axis label -->
  <text x="20" y="140" font-size="12" fill="#64748b" transform="rotate(-90 20 140)" text-anchor="middle">Frequency</text>
  <!-- X-axis label -->
  <text x="250" y="285" font-size="12" fill="#64748b" text-anchor="middle">Salary (in thousands)</text>
  <!-- Title -->
  <text x="250" y="22" font-size="14" fill="#1e293b" font-weight="bold" text-anchor="middle">Distribution of Salary — 10,000 Employees</text>
  <!-- Histogram bars (right-skewed distribution) -->
  <rect x="70" y="220" width="35" height="30" fill="#3b82f6" opacity="0.8"/>
  <rect x="110" y="170" width="35" height="80" fill="#3b82f6" opacity="0.8"/>
  <rect x="150" y="100" width="35" height="150" fill="#3b82f6" opacity="0.8"/>
  <rect x="190" y="60" width="35" height="190" fill="#3b82f6" opacity="0.8"/>
  <rect x="230" y="80" width="35" height="170" fill="#3b82f6" opacity="0.8"/>
  <rect x="270" y="120" width="35" height="130" fill="#3b82f6" opacity="0.8"/>
  <rect x="310" y="170" width="35" height="80" fill="#3b82f6" opacity="0.8"/>
  <rect x="350" y="210" width="35" height="40" fill="#3b82f6" opacity="0.8"/>
  <rect x="390" y="230" width="35" height="20" fill="#3b82f6" opacity="0.8"/>
  <!-- X-axis tick labels -->
  <text x="87" y="265" font-size="10" fill="#64748b" text-anchor="middle">30</text>
  <text x="127" y="265" font-size="10" fill="#64748b" text-anchor="middle">40</text>
  <text x="167" y="265" font-size="10" fill="#64748b" text-anchor="middle">50</text>
  <text x="207" y="265" font-size="10" fill="#64748b" text-anchor="middle">60</text>
  <text x="247" y="265" font-size="10" fill="#64748b" text-anchor="middle">70</text>
  <text x="287" y="265" font-size="10" fill="#64748b" text-anchor="middle">80</text>
  <text x="327" y="265" font-size="10" fill="#64748b" text-anchor="middle">90</text>
  <text x="367" y="265" font-size="10" fill="#64748b" text-anchor="middle">100</text>
  <text x="407" y="265" font-size="10" fill="#64748b" text-anchor="middle">110</text>
</svg>
